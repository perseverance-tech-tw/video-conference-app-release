name: Build PySide6 aarch64 Docker Image

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.pyside6-aarch64
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pyside6-aarch64:python3.8-bullseye
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/pyside6-aarch64:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/pyside6-aarch64:cache,mode=max
