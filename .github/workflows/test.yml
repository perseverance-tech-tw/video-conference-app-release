- name: Build aarch64 inside Docker (QEMU)
  run: |
    docker run --rm --platform linux/arm64 \
      -v ${{ github.workspace }}/video-conference-using-fisheye:/app \
      -e TAG_NAME=${{ env.TAG_NAME }} \
      python:3.8-slim-buster bash -c '
        set -e

        echo "==> Fix Debian Buster EOL repository"
        echo "deb http://archive.debian.org/debian buster main contrib non-free" > /etc/apt/sources.list
        echo "deb http://archive.debian.org/debian-security buster/updates main contrib non-free" >> /etc/apt/sources.list

        echo "==> Install system dependencies"
        apt-get update -o Acquire::Check-Valid-Until=false && apt-get install -y \
          libgl1-mesa-glx libglib2.0-0 libsm6 libxrender1 libxext6 \
          libx11-6 libxcb1 libxkbcommon0 p7zip-full binutils \
          build-essential cmake git \
          pkg-config libhdf5-dev \
          && rm -rf /var/lib/apt/lists/*

        echo "==> Create .venv"
        python -m venv /app/.venv

        echo "==> Upgrade pip inside .venv"
        /app/.venv/bin/pip install --upgrade pip setuptools wheel

        echo "==> Install mediapipe without deps"
        /app/.venv/bin/pip install mediapipe==0.10.7 --no-deps

        echo "==> Patch mediapipe for Python 3.8"
        SITE_PACKAGES=$(/app/.venv/bin/python -c "import site; print(site.getsitepackages()[0])")
        find "$SITE_PACKAGES/mediapipe/" -name "*.py" | xargs grep -l "list\[" 2>/dev/null | \
          xargs -I{} sed -i "s/) -> list\[/) -> List[/g" {} || true
        find "$SITE_PACKAGES/mediapipe/" -name "*.py" | xargs grep -l "List\[" 2>/dev/null | \
          xargs -I{} sed -i "1s/^/from typing import List\n/" {} || true

        echo "==> Install pyvirtualcam from GitHub source"
        /app/.venv/bin/pip install --no-cache-dir \
          git+https://github.com/letmaik/pyvirtualcam.git@v0.11.1 || echo "pyvirtualcam skipped"

        echo "==> Install remaining dependencies"
        /app/.venv/bin/pip install --no-cache-dir -r /app/requirements-aarch64.txt

        echo "==> Update version.txt"
        echo $TAG_NAME > /app/version.txt

        echo "==> Build with PyInstaller"
        cd /app
        mkdir -p dist/aarch64
        /app/.venv/bin/pyinstaller --clean --distpath dist/aarch64 video-conference-using-fisheye.spec
      '
